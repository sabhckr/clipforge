name: Android

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Validate the committed Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Unit tests (segmentation, JSON, signatures vs desktop golden files)
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Desktop verifier accepts the Android signature
        run: |
          python -m pip install --quiet cryptography==50.0.2
          python tools/verify_cross_check.py app/build/cross-check/kotlin_signed.json
      - name: Decode release signing key (only when the repository secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.CLIPFORGE_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "CLIPFORGE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          CLIPFORGE_KEYSTORE_PASSWORD: ${{ secrets.CLIPFORGE_KEYSTORE_PASSWORD }}
          CLIPFORGE_KEY_ALIAS: ${{ secrets.CLIPFORGE_KEY_ALIAS }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease
      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CLIPFORGE-1.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/CLIPFORGE-1.0.0-debug.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - name: Check APK signature and manifest
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs dist/CLIPFORGE-1.0.0.apk | tee "$RUNNER_TEMP/sig.txt"
          grep -q "Verified using v1 scheme (JAR signing): true" "$RUNNER_TEMP/sig.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/sig.txt"
          "$BT/aapt2" dump badging dist/CLIPFORGE-1.0.0.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|launchable-activity)"
      - uses: actions/upload-artifact@v4
        with:
          name: CLIPFORGE-android-apk
          path: android/dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: android/app/build/reports/

  emulator:
    name: Emulator tests (Android API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Download the release APK built above
        uses: actions/download-artifact@v4
        with:
          name: CLIPFORGE-android-apk
          path: android/dist
      - name: Install and launch the release APK, then run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: |
            adb install dist/CLIPFORGE-1.0.0.apk
            adb shell am start -W -n com.clipforge.app/.MainActivity
            sleep 10
            adb shell pidof com.clipforge.app
            ! adb logcat -d -b crash | grep -q com.clipforge.app
            adb uninstall com.clipforge.app
            gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports-api${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
